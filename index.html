<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACZZ Spin Bot - Project Slayer 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 36px;
    width: 420px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 6px; color: #4da6ff; }
  .sub { color: #666; font-size: 12px; margin-bottom: 28px; }
  input {
    width: 100%;
    padding: 12px 16px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 14px;
    outline: none;
  }
  input:focus { border-color: #4da6ff; }
  button {
    width: 100%;
    padding: 13px;
    background: #4da6ff;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #3a8fd4; }
  button:disabled { background: #333; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 13px; min-height: 20px; }
  .ok   { color: #4cff8f; }
  .err  { color: #ff4c4c; }
  .warn { color: #ffc14c; }
  .script-panel { display: none; margin-top: 24px; text-align: left; }
  .script-panel.show { display: block; }
  .script-label { font-size: 12px; color: #888; margin-bottom: 8px; }
  .script-box {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #7fff7f;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre;
    user-select: all;
  }
  .copy-btn {
    margin-top: 10px;
    background: #222;
    border: 1px solid #444;
    padding: 10px;
    font-size: 13px;
    border-radius: 8px;
  }
  .copy-btn:hover { background: #333; }
  .hwid-box {
    margin-top: 10px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: #888;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="box">
  <h1>HACZZ Spin Bot</h1>
  <div class="sub">Project Slayer 2 | Nhap key de lay script</div>
  <input id="keyInput" type="text" placeholder="HACZZ-XXXX-XXXX-XXXX"
         maxlength="40" autocomplete="off" spellcheck="false">
  <button id="authBtn" onclick="doAuth()">Kich hoat</button>
  <div class="status" id="status"></div>
  <div class="script-panel" id="scriptPanel">
    <div class="script-label">Lua Script — Copy va paste vao Delta executor:</div>
    <div class="script-box" id="scriptBox"></div>
    <button class="copy-btn" onclick="copyScript()">Copy Script</button>
    <div class="hwid-box" id="hwidBox"></div>
  </div>
</div>

<script>
const BIN_ID     = "6ab6d3ceffd5d160532f0e2a"
const MASTER_KEY = "$2a$10$dHm3pkZ62aJW/K4QqOUL.eehuOyT8KgV1gDXc8W.lgbPboJ.IMrIu"
const BASE       = `https://api.jsonbin.io/v3/b/${BIN_ID}`
const HEADERS    = {
  "X-Master-Key": MASTER_KEY,
  "Content-Type": "application/json"
}

const SCRIPT = `loadstring(game:HttpGet("https://raw.githubusercontent.com/HaczzLongzz/Spin-pjs2/main/spin.lua"))()`
local TeleportService=game:GetService("TeleportService")
local lp=Players.LocalPlayer
local gui=lp:WaitForChild("PlayerGui")
local SG=game:GetService("StarterGui")
local RUNNING=false
local SPINS=0
local CLANS={"Kamado","Rengoku","Soyama","Uzui"}

local function notify(t,m)
    SG:SetCore("SendNotification",{Title=t,Text=m,Duration=5})
end

local function findRollBtn()
    for _,v in pairs(gui:GetDescendants())do
        if v:IsA("TextButton") or v:IsA("ImageButton") then
            for _,c in pairs(v:GetDescendants())do
                if c:IsA("TextLabel") and c.Text:find("Roll") then
                    return v
                end
            end
        end
    end
    return nil
end

local function fireBtn(btn)
    local fired=false
    pcall(function() firebutton(btn,"LeftMouseButton") fired=true end)
    if fired then return end
    pcall(function() firebutton(btn) fired=true end)
    if fired then return end
    pcall(function()
        local conns=getconnections(btn.MouseButton1Click)
        for _,c in ipairs(conns) do c:Fire() end
        fired=true
    end)
    if fired then return end
    pcall(function()
        local conns=getconnections(btn.Activated)
        for _,c in ipairs(conns) do c:Fire() end
        fired=true
    end)
    if fired then return end
    pcall(function()
        local d=getconnections(btn.MouseButton1Down)
        for _,c in ipairs(d) do c:Fire() end
        task.wait(0.05)
        local u=getconnections(btn.MouseButton1Up)
        for _,c in ipairs(u) do c:Fire() end
    end)
end

-- Skip anim: fire click event tren nut roll 5 lan, khong can chuot vat ly
local function skipAnim()
    local btn=findRollBtn()
    if not btn then return end
    task.wait(0.2)
    for i=1,5 do
        pcall(function()
            local conns=getconnections(btn.MouseButton1Click)
            for _,c in ipairs(conns) do c:Fire() end
        end)
        pcall(function()
            local conns=getconnections(btn.Activated)
            for _,c in ipairs(conns) do c:Fire() end
        end)
        task.wait(0.18)
    end
end

local function handlePopup(isSupreme)
    task.wait(0.5)
    for _,v in pairs(gui:GetDescendants())do
        if v:IsA("TextLabel") and v.Visible then
            local t=v.Text or ""
            if t:find("Are you sure") or t:find("Rolling replaces") then
                local frame=v.Parent
                local buttons={}
                for _,b in pairs(frame:GetDescendants())do
                    if b:IsA("ImageButton") or b:IsA("TextButton") then
                        table.insert(buttons,b)
                    end
                end
                table.sort(buttons,function(a,b)
                    return a.AbsolutePosition.X < b.AbsolutePosition.X
                end)
                if #buttons>=2 then
                    if isSupreme then
                        fireBtn(buttons[#buttons])
                        print("Supreme: giu lai")
                    else
                        fireBtn(buttons[1])
                        print("Not supreme: quay tiep")
                    end
                end
                return
            end
        end
    end
end

local function checkClan()
    for _,v in pairs(gui:GetDescendants())do
        if v:IsA("TextLabel") and v.Visible then
            local t=v.Text or ""
            if t:find("%(") and t:find("%)") then
                for _,c in ipairs(CLANS)do
                    if t:find(c) then
                        print("SUPREME:",t)
                        return c
                    end
                end
            end
        end
    end
    return nil
end

-- UI
local stopGui=Instance.new("ScreenGui")
stopGui.Name="SpinBotUI"
stopGui.ResetOnSpawn=false
stopGui.ZIndexBehavior=Enum.ZIndexBehavior.Sibling
stopGui.Parent=lp:WaitForChild("PlayerGui")

local frame=Instance.new("Frame")
frame.Size=UDim2.new(0,150,0,95)
frame.Position=UDim2.new(0,10,1,-105)
frame.BackgroundColor3=Color3.fromRGB(30,30,30)
frame.BorderSizePixel=0
frame.Parent=stopGui
Instance.new("UICorner",frame).CornerRadius=UDim.new(0,8)

local spinLabel=Instance.new("TextLabel")
spinLabel.Size=UDim2.new(1,0,0,25)
spinLabel.Position=UDim2.new(0,0,0,5)
spinLabel.BackgroundTransparency=1
spinLabel.Text="Spins: 0"
spinLabel.TextColor3=Color3.new(1,1,1)
spinLabel.Font=Enum.Font.GothamBold
spinLabel.TextScaled=true
spinLabel.Parent=frame

-- START button
local startBtn=Instance.new("TextButton")
startBtn.Size=UDim2.new(1,-10,0,28)
startBtn.Position=UDim2.new(0,5,0,30)
startBtn.BackgroundColor3=Color3.fromRGB(50,180,50)
startBtn.Text="START SPIN"
startBtn.TextColor3=Color3.new(1,1,1)
startBtn.Font=Enum.Font.GothamBold
startBtn.TextScaled=true
startBtn.BorderSizePixel=0
startBtn.Parent=frame
Instance.new("UICorner",startBtn).CornerRadius=UDim.new(0,6)

-- STOP button
local stopBtn=Instance.new("TextButton")
stopBtn.Size=UDim2.new(1,-10,0,28)
stopBtn.Position=UDim2.new(0,5,0,62)
stopBtn.BackgroundColor3=Color3.fromRGB(200,50,50)
stopBtn.Text="STOP SPIN"
stopBtn.TextColor3=Color3.new(1,1,1)
stopBtn.Font=Enum.Font.GothamBold
stopBtn.TextScaled=true
stopBtn.BorderSizePixel=0
stopBtn.Parent=frame
Instance.new("UICorner",stopBtn).CornerRadius=UDim.new(0,6)

local function main()
    notify("SpinBot","Waiting for Roll button...")
    local btn=nil
    for i=1,30 do
        btn=findRollBtn()
        if btn then break end
        task.wait(1)
    end
    if not btn then
        notify("ERROR","Mo UI spin truoc!")
        return
    end
    notify("SpinBot","Found! Farming Supreme...")
    while RUNNING do
        btn=findRollBtn()
        if not btn or not btn.Visible or not btn.Active then
            notify("SpinBot","Het spin! Dung lai.")
            RUNNING=false
            return
        end
        fireBtn(btn)
        SPINS=SPINS+1
        spinLabel.Text="Spins: "..SPINS
        print("Spin#"..SPINS)
        skipAnim()
        task.wait(0.3)
        local r=checkClan()
        print("Result:",tostring(r))
        if r then
            notify("SUPREME GOT!",r.." - "..SPINS.." spins!")
            handlePopup(true)
            RUNNING=false
            task.wait(3)
            stopGui:Destroy()
            TeleportService:Teleport(game.PlaceId,lp)
            return
        end
        handlePopup(false)
        task.wait(0.2+math.random()*0.2)
    end
end

startBtn.MouseButton1Click:Connect(function()
    if RUNNING then return end
    RUNNING=true
    startBtn.BackgroundColor3=Color3.fromRGB(30,100,30)
    task.spawn(main)
end)

stopBtn.MouseButton1Click:Connect(function()
    RUNNING=false
    notify("SpinBot","STOPPED - "..SPINS.." spins total.")
    startBtn.BackgroundColor3=Color3.fromRGB(50,180,50)
end)

notify("HACZZ","SpinBot loaded! Bam START de bat dau.")`

function getHWID() {
  const nav = navigator
  const raw = [
    nav.userAgent, nav.language,
    screen.width + "x" + screen.height,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    nav.hardwareConcurrency,
    nav.platform
  ].join("|")
  let hash = 0
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i)
    hash |= 0
  }
  return "WEB-" + Math.abs(hash).toString(16).toUpperCase()
}

function setStatus(msg, cls) {
  const el = document.getElementById("status")
  el.textContent = msg
  el.className = "status " + cls
}

async function doAuth() {
  const key  = document.getElementById("keyInput").value.trim().toUpperCase()
  const hwid = getHWID()
  const btn  = document.getElementById("authBtn")
  if (!key) { setStatus("Nhap key truoc", "warn"); return }
  btn.disabled = true
  setStatus("Dang kiem tra...", "warn")
  try {
    const r1   = await fetch(`${BASE}/latest`, { headers: HEADERS })
    const data = await r1.json()
    const rec  = data.record
    const keys = rec.keys
    if (!(key in keys)) {
      setStatus("Key khong hop le", "err")
      btn.disabled = false
      return
    }
    const entry = keys[key]
    if (entry.used) {
      if (entry.hwid === hwid) {
        showScript(hwid)
        setStatus("HWID khop — chao mung lai!", "ok")
        return
      }
      setStatus("Key da duoc su dung tren thiet bi khac", "err")
      btn.disabled = false
      return
    }
    rec.keys[key].used = true
    rec.keys[key].hwid = hwid
    await fetch(BASE, {
      method: "PUT",
      headers: HEADERS,
      body: JSON.stringify(rec)
    })
    showScript(hwid)
    setStatus("Kich hoat thanh cong!", "ok")
  } catch(e) {
    setStatus("Loi ket noi: " + e.message, "err")
    btn.disabled = false
  }
}

function showScript(hwid) {
  document.getElementById("scriptBox").textContent = SCRIPT
  document.getElementById("hwidBox").textContent   = "HWID: " + hwid
  document.getElementById("scriptPanel").classList.add("show")
  document.getElementById("authBtn").disabled = false
}

function copyScript() {
  navigator.clipboard.writeText(SCRIPT)
  setStatus("Da copy script!", "ok")
}

document.getElementById("keyInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doAuth()
})
</script>
</body>
</html>
