<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACZZ Spin Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 36px;
    width: 420px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 6px; color: #4da6ff; }
  .sub { color: #666; font-size: 12px; margin-bottom: 28px; }
  input {
    width: 100%;
    padding: 12px 16px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 14px;
    outline: none;
  }
  input:focus { border-color: #4da6ff; }
  button {
    width: 100%;
    padding: 13px;
    background: #4da6ff;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #3a8fd4; }
  button:disabled { background: #333; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    font-size: 13px;
    min-height: 20px;
  }
  .ok  { color: #4cff8f; }
  .err { color: #ff4c4c; }
  .warn { color: #ffc14c; }

  /* Script panel */
  .script-panel {
    display: none;
    margin-top: 24px;
    text-align: left;
  }
  .script-panel.show { display: block; }
  .script-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }
  .script-box {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #7fff7f;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre;
    user-select: all;
  }
  .copy-btn {
    margin-top: 10px;
    background: #222;
    border: 1px solid #444;
    padding: 10px;
    font-size: 13px;
    border-radius: 8px;
  }
  .copy-btn:hover { background: #333; }
  .hwid-box {
    margin-top: 10px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: #888;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="box">
  <h1>HACZZ Spin Bot</h1>
  <div class="sub">Nhap key de lay script</div>

  <input id="keyInput" type="text" placeholder="HACZZ-XXXX-XXXX-XXXX"
         maxlength="40" autocomplete="off" spellcheck="false">
  <button id="authBtn" onclick="doAuth()">Kich hoat</button>
  <div class="status" id="status"></div>

  <div class="script-panel" id="scriptPanel">
    <div class="script-label">Lua Script — Copy va paste vao executor:</div>
    <div class="script-box" id="scriptBox"></div>
    <button class="copy-btn" onclick="copyScript()">Copy Script</button>
    <div class="hwid-box" id="hwidBox"></div>
  </div>
</div>

<script>
const BIN_ID     = "6ab6d3ceffd5d160532f0e2a"
const MASTER_KEY = "$2a$10$dHm3pkZ62aJW/K4QqOUL.eehuOyT8KgV1gDXc8W.lgbPboJ.IMrIu"
const BASE       = `https://api.jsonbin.io/v3/b/${BIN_ID}`
const HEADERS    = {
  "X-Master-Key": MASTER_KEY,
  "Content-Type": "application/json"
}

const SCRIPT = `-- HACZZ Spin Bot
local Players = game:GetService("Players")
local RunService = game:GetService("RunService")
local UIS = game:GetService("UserInputService")
local lp = Players.LocalPlayer
local char = lp.Character or lp.CharacterAdded:Wait()
local hrp = char:WaitForChild("HumanoidRootPart")

local spinning = false
local speed = 20

UIS.InputBegan:Connect(function(inp, gpe)
    if gpe then return end
    if inp.KeyCode == Enum.KeyCode.P then
        spinning = not spinning
        print("[SpinBot] Spin: " .. tostring(spinning))
    end
end)

RunService.RenderStepped:Connect(function()
    if spinning and hrp then
        hrp.CFrame = hrp.CFrame * CFrame.Angles(0, math.rad(speed), 0)
    end
end)

print("[HACZZ] SpinBot loaded | P = toggle")`

// Lấy HWID từ browser (fingerprint nhẹ)
function getHWID() {
  const nav = navigator
  const raw = [
    nav.userAgent,
    nav.language,
    screen.width + "x" + screen.height,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    nav.hardwareConcurrency,
    nav.platform
  ].join("|")
  // simple hash
  let hash = 0
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i)
    hash |= 0
  }
  return "WEB-" + Math.abs(hash).toString(16).toUpperCase()
}

function setStatus(msg, cls) {
  const el = document.getElementById("status")
  el.textContent = msg
  el.className = "status " + cls
}

async function doAuth() {
  const key  = document.getElementById("keyInput").value.trim().toUpperCase()
  const hwid = getHWID()
  const btn  = document.getElementById("authBtn")

  if (!key) { setStatus("Nhap key truoc", "warn"); return }

  btn.disabled = true
  setStatus("Dang kiem tra...", "warn")

  try {
    // Đọc bin
    const r1   = await fetch(`${BASE}/latest`, { headers: HEADERS })
    const data = await r1.json()
    const rec  = data.record
    const keys = rec.keys

    if (!(key in keys)) {
      setStatus("Key khong hop le", "err")
      btn.disabled = false
      return
    }

    const entry = keys[key]

    if (entry.used) {
      if (entry.hwid === hwid) {
        // Same browser — cho vào lại
        showScript(hwid)
        setStatus("HWID khop — chao mung lai!", "ok")
        return
      }
      setStatus("Key da duoc su dung tren thiet bi khac", "err")
      btn.disabled = false
      return
    }

    // Lock key
    rec.keys[key].used = true
    rec.keys[key].hwid = hwid

    await fetch(BASE, {
      method: "PUT",
      headers: HEADERS,
      body: JSON.stringify(rec)
    })

    showScript(hwid)
    setStatus("Kich hoat thanh cong!", "ok")

  } catch(e) {
    setStatus("Loi ket noi: " + e.message, "err")
    btn.disabled = false
  }
}

function showScript(hwid) {
  document.getElementById("scriptBox").textContent = SCRIPT
  document.getElementById("hwidBox").textContent   = "HWID: " + hwid
  document.getElementById("scriptPanel").classList.add("show")
  document.getElementById("authBtn").disabled = false
}

function copyScript() {
  navigator.clipboard.writeText(SCRIPT)
  setStatus("Da copy script!", "ok")
}

document.getElementById("keyInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doAuth()
})
</script>
</body>
</html>
